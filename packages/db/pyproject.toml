[project]
name = "financeos-db"
version = "0.1.0"
description = "SQLAlchemy models and Alembic migrations for FinanceOS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financeos_db"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["alembic/versions"]  # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
