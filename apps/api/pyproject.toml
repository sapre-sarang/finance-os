[project]
name = "financeos-api"
version = "0.1.0"
description = "FinanceOS HTTP API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "financeos-core",
    "financeos-db",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
financeos-core = { path = "../../packages/core", editable = true }
financeos-db = { path = "../../packages/db", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
